# Local development services. `docker compose up -d` starts PostgreSQL (and Mailpit, with Identity).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apihost
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps its data in a version-named folder under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql

#if (Identity)
  # Catches every email the app sends in Development (see Email:Smtp in
  # appsettings.Development.json); read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "8025:8025"   # web interface
      - "1025:1025"   # SMTP

#endif
  # Optional: see the app's traces, metrics and logs at http://localhost:18888.
  #   docker compose --profile observability up -d
  # then run the API with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 (see README.md).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    profiles: [observability]
    environment:
      # Local use only: no login for the dashboard.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # dashboard
      - "4317:18889"    # OTLP over gRPC, where the app sends telemetry

volumes:
  postgres-data:
