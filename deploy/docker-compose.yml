# Production: PostgreSQL, the app, and Caddy for automatic HTTPS. See deploy/README.md.
#   docker compose --env-file .env up -d
# Only Caddy is reachable from outside (ports 80 and 443); the app and database are not.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apihost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: apihost
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apihost -d apihost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Built with: dotnet publish src/ApiHost -c Release /t:PublishContainer
    image: ${APP_IMAGE:-apihost:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Read the client's real address (and HTTPS) from Caddy's X-Forwarded-* headers.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
#if (IsMarten)
      ConnectionStrings__Marten: Host=postgres;Database=apihost;Username=apihost;Password=${POSTGRES_PASSWORD}
#else
      ConnectionStrings__Postgres: Host=postgres;Database=apihost;Username=apihost;Password=${POSTGRES_PASSWORD}
#endif
#if (Identity)
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__From: ${SMTP_FROM:-}
#endif
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
