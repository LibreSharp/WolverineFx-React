name: Release

# Publish a version by pushing a tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
# The tag sets the package version (v0.1.0 -> 0.1.0; v0.2.0-beta.1 -> 0.2.0-beta.1).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The full CI matrix (build, tests, publish-and-run) must pass before anything is released.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # nuget.org Trusted Publishing (short-lived key, no stored secret)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Pack
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a version like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          dotnet pack LibreSharp.Templates.WolverineFxReact.csproj -c Release -o dist -p:PackageVersion="$version"

      # Exchanges this workflow's GitHub identity for a short-lived nuget.org API key. Needs a
      # Trusted Publishing policy on nuget.org for LibreSharp/WolverineFx-React and release.yml,
      # and the repository variable NUGET_USER set to that nuget.org account's username.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "dist/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

      # The notes come from docs/releases/<tag>.md when there is one (commits go straight to main,
      # so generated notes, which list pull requests, would say little).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/*.nupkg --title "$GITHUB_REF_NAME" "${notes_args[@]}" \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
