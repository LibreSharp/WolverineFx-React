name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # run by release.yml before publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: ${{ matrix.persistence }} · identity=${{ matrix.identity }} · tests=${{ matrix.tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        persistence: [marten, efcore]
        identity: [false, true]
        tests: [false, true]

    env:
      APP_DIR: ${{ github.workspace }}/../generated/MyApp

    # Database for the published app in the "Publish and run" step (the tests use Testcontainers).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Client/package-lock.json

      - name: Install template
        run: dotnet new install ./

      # -n MyApp exercises sourceName replacement: the solution, namespaces and project become MyApp.
      - name: Generate project
        run: >
          dotnet new wolverine-react -n MyApp -o "$APP_DIR"
          --Persistence ${{ matrix.persistence }}
          --Identity ${{ matrix.identity }}
          --IncludeTests ${{ matrix.tests }}

      - name: Build API
        working-directory: ${{ env.APP_DIR }}
        run: dotnet build MyApp.slnx

      - name: Build client
        working-directory: ${{ env.APP_DIR }}/src/Client
        run: |
          npm ci
          npm run build

      # Testcontainers starts a throwaway Postgres; GitHub's Ubuntu runners have Docker preinstalled.
      - name: Test
        if: ${{ matrix.tests }}
        working-directory: ${{ env.APP_DIR }}
        run: dotnet test MyApp.slnx --no-build --logger "console;verbosity=normal"

      # Publish like a real deployment (pre-generated Wolverine code, bundled React client) and
      # start it in Production. Static code loading makes the app fail at startup if any
      # generated code is missing, so a successful response proves the publish is complete.
      # The production container image (see deploy/README.md); GitHub's runners have Docker.
      - name: Build container image
        working-directory: ${{ env.APP_DIR }}
        run: |
          dotnet publish src/MyApp -c Release /t:PublishContainer
          docker image inspect myapp:latest --format 'Built {{.RepoTags}}, {{.Size}} bytes'

      - name: Publish and run
        working-directory: ${{ env.APP_DIR }}
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__Marten: Host=localhost;Database=myapp;Username=postgres;Password=postgres
          ConnectionStrings__Postgres: Host=localhost;Database=myapp;Username=postgres;Password=postgres
          Jwt__SigningKey: ci-only-signing-key-that-is-long-enough-0123456789
        run: |
          dotnet publish src/MyApp -c Release -o "$RUNNER_TEMP/publish"
          test -d src/MyApp/Internal/Generated || { echo "codegen did not run"; exit 1; }
          # Run from the publish folder, as a deployment would: the content root (and so wwwroot,
          # the bundled React app) is the current directory.
          (cd "$RUNNER_TEMP/publish" && dotnet MyApp.dll > "$RUNNER_TEMP/app.log" 2>&1 &)
          fail() { echo "$1"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://localhost:5000/ \
            || fail "The published app did not serve the client."
          expected=${{ matrix.identity && '401' || '200' }}
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/todos)
          [ "$status" = "$expected" ] || fail "GET /api/todos returned $status, expected $expected."
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/health/ready)
          [ "$ready" = "200" ] || fail "GET /health/ready returned $ready, expected 200."
          echo "Published app is running: GET / 200, GET /api/todos $status, GET /health/ready 200."
