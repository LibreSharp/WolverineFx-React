name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # run by release.yml before publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package published to nuget.org only contains what LibreSharp.Templates.WolverineFxReact.csproj
  # lists, while the matrix below installs the template from this folder. Check that the package
  # generates exactly the same projects, so a file missing from the package can't slip through.
  package:
    name: Package generates the same projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Pack, then compare generated projects
        run: |
          dotnet pack LibreSharp.Templates.WolverineFxReact.csproj -c Release -o "$RUNNER_TEMP/pack" -p:PackageVersion=0.0.0-ci
          dotnet new install "$RUNNER_TEMP"/pack/*.nupkg --debug:custom-hive "$RUNNER_TEMP/hive-package"
          dotnet new install ./ --debug:custom-hive "$RUNNER_TEMP/hive-folder"
          for persistence in marten efcore; do
            for auth in none identity saas; do
              args="--Persistence $persistence --Auth $auth --IncludeTests true"
              dotnet new wolverine-react -n MyApp -o "$RUNNER_TEMP/out/package-$persistence-$auth" $args --debug:custom-hive "$RUNNER_TEMP/hive-package"
              dotnet new wolverine-react -n MyApp -o "$RUNNER_TEMP/out/folder-$persistence-$auth" $args --debug:custom-hive "$RUNNER_TEMP/hive-folder"
              diff -r "$RUNNER_TEMP/out/package-$persistence-$auth" "$RUNNER_TEMP/out/folder-$persistence-$auth"
            done
          done

  template:
    name: ${{ matrix.persistence }} · auth=${{ matrix.auth }} · tests=${{ matrix.tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        persistence: [marten, efcore]
        auth: [none, identity, saas]
        tests: [false, true]

    env:
      APP_DIR: ${{ github.workspace }}/../generated/MyApp

    # Database for the published app in the "Publish and run" step (the tests use Testcontainers).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Catches the published app's emails, which the end-to-end tests read (confirmation links).
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Client/package-lock.json

      - name: Install template
        run: dotnet new install ./

      # -n MyApp exercises sourceName replacement: the solution, namespaces and project become MyApp.
      - name: Generate project
        run: >
          dotnet new wolverine-react -n MyApp -o "$APP_DIR"
          --Persistence ${{ matrix.persistence }}
          --Auth ${{ matrix.auth }}
          --IncludeTests ${{ matrix.tests }}

      - name: Build API
        working-directory: ${{ env.APP_DIR }}
        run: dotnet build MyApp.slnx

      - name: Build client
        working-directory: ${{ env.APP_DIR }}/src/Client
        run: |
          npm ci
          npm run build

      # Vitest and React Testing Library, with the API faked by MSW; and oxlint. The client's
      # tests live in src/Client, so they run whatever --IncludeTests says.
      - name: Client unit tests and lint
        working-directory: ${{ env.APP_DIR }}/src/Client
        run: |
          npm test
          npm run lint

      # Testcontainers starts a throwaway Postgres; GitHub's Ubuntu runners have Docker preinstalled.
      - name: Test
        if: ${{ matrix.tests }}
        working-directory: ${{ env.APP_DIR }}
        run: dotnet test MyApp.slnx --no-build --logger "console;verbosity=normal"

      # Publish like a real deployment (pre-generated Wolverine code, bundled React client) and
      # start it in Production. Static code loading makes the app fail at startup if any
      # generated code is missing, so a successful response proves the publish is complete.
      # The production container image (see deploy/README.md); GitHub's runners have Docker.
      - name: Build container image
        working-directory: ${{ env.APP_DIR }}
        run: |
          dotnet publish src/MyApp -c Release /t:PublishContainer
          docker image inspect myapp:latest --format 'Built {{.RepoTags}}, {{.Size}} bytes'

      - name: Publish and run
        working-directory: ${{ env.APP_DIR }}
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__Marten: Host=localhost;Database=myapp;Username=postgres;Password=postgres
          ConnectionStrings__Postgres: Host=localhost;Database=myapp;Username=postgres;Password=postgres
          Jwt__SigningKey: ci-only-signing-key-that-is-long-enough-0123456789
          # For the end-to-end tests (ignored with --Auth none): email through Mailpit, an admin
          # account, and a higher sign-in rate limit, since every test comes from one address.
          Email__Smtp__Host: localhost
          Email__Smtp__Port: "1025"
          Email__Smtp__Security: None
          Email__Smtp__From: no-reply@example.com
          Accounts__AdminEmails__0: admin-e2e@example.com
          Accounts__AuthAttemptsPerMinute: "1000"
        run: |
          dotnet publish src/MyApp -c Release -o "$RUNNER_TEMP/publish"
          test -d src/MyApp/Internal/Generated || { echo "codegen did not run"; exit 1; }
          # Run from the publish folder, as a deployment would: the content root (and so wwwroot,
          # the bundled React app) is the current directory.
          (cd "$RUNNER_TEMP/publish" && dotnet MyApp.dll > "$RUNNER_TEMP/app.log" 2>&1 &)
          fail() { echo "$1"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://localhost:5000/ \
            || fail "The published app did not serve the client."
          expected=${{ matrix.auth != 'none' && '401' || '200' }}
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/todos)
          [ "$status" = "$expected" ] || fail "GET /api/todos returned $status, expected $expected."
          # The page must actually work in a browser: its scripts load, and React renders. (The home
          # page is pre-rendered, so check a page only the running app can show: the not-found page.)
          script=$(curl -s http://localhost:5000/ | grep -oE 'href="/assets/[^"]+\.js"' | head -1 | cut -d'"' -f2)
          type=$(curl -s -o /dev/null -w '%{content_type}' "http://localhost:5000$script")
          [[ "$type" == text/javascript* ]] || fail "The client script $script was served as '$type'."
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 \
            --dump-dom http://localhost:5000/no-such-page > "$RUNNER_TEMP/page.html" 2>/dev/null
          grep -q "Page not found" "$RUNNER_TEMP/page.html" \
            || fail "The React app didn't render in Chrome: $(head -c 600 "$RUNNER_TEMP/page.html")"
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/health/ready)
          [ "$ready" = "200" ] || fail "GET /health/ready returned $ready, expected 200."
          # Search engines: the home page is pre-rendered HTML (its content without JavaScript),
          # unknown pages are real 404s, and robots.txt and sitemap.xml are served.
          curl -fs http://localhost:5000/ | grep -q "<h1" \
            || fail "GET / isn't pre-rendered: no heading in its HTML."
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/no-such-page)
          [ "$missing" = "404" ] || fail "GET /no-such-page returned $missing, expected 404."
          curl -fs http://localhost:5000/robots.txt | grep -q "Sitemap: http://localhost:5000/sitemap.xml" \
            || fail "robots.txt doesn't point at the sitemap."
          curl -fs http://localhost:5000/sitemap.xml | grep -q "<loc>http://localhost:5000/</loc>" \
            || fail "sitemap.xml doesn't list the home page."
          echo "Published app works: renders in Chrome, GET /api/todos $status, GET /health/ready 200."

      # Playwright in Chrome against the published app still running from the step above, with
      # real emails through Mailpit: sign-up and confirmation, Todos with live updates, settings,
      # lockout, the admin page and invitations, and passkeys (Chrome's virtual authenticator).
      - name: End-to-end tests
        if: ${{ matrix.tests }}
        working-directory: ${{ env.APP_DIR }}/tests/e2e
        env:
          E2E_BASE_URL: http://localhost:5000
          MAILPIT_URL: http://localhost:8025
        run: |
          npm ci
          npx playwright test

      - name: Upload end-to-end traces
        if: ${{ failure() && matrix.tests }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.persistence }}-${{ matrix.auth }}-tests-${{ matrix.tests }}
          path: ${{ env.APP_DIR }}/tests/e2e/test-results/
          if-no-files-found: ignore
